<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW2.5 バフ・デバフ＆キャラ管理ツール v2</title>
<style>
  :root {
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --primary: #2b5278;
    --accent: #d9534f;
    --active: #28a745;
    --text: #333333;
    --border: #ced4da;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text);
    margin: 0;
    padding: 16px;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 768px) {
    .container { grid-template-columns: 340px 1fr; }
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  h2 {
    margin-top: 0;
    font-size: 1.05rem;
    color: var(--primary);
    border-bottom: 2px solid #eef2f5;
    padding-bottom: 8px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .stat-box {
    background: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .stat-title { font-size: 0.8rem; color: #6c757d; font-weight: bold; }
  .stat-value { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin: 2px 0; }
  .stat-diff { font-size: 0.8rem; font-weight: bold; }
  .diff-plus { color: var(--active); }
  .diff-minus { color: var(--accent); }

  /* カスタム調整ボタン */
  .custom-ctrl {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-top: 4px;
  }
  .btn-step {
    padding: 4px 8px;
    font-size: 0.8rem;
    font-weight: bold;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .input-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .input-group label { font-size: 0.85rem; font-weight: 500; }
  .input-group input {
    width: 65px;
    padding: 6px;
    font-size: 1rem;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  /* キャラ保存エリア */
  .char-save-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .char-save-bar input {
    flex: 1;
    padding: 8px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .btn-main {
    padding: 8px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.9rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  .char-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .char-chip {
    padding: 8px 12px;
    background: #eef2f5;
    border: 2px solid transparent;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
  }
  .char-chip.active {
    background: #e2edf8;
    border-color: var(--primary);
    color: var(--primary);
  }
  .btn-del-char {
    color: #999;
    font-size: 1rem;
    line-height: 1;
    border: none;
    background: none;
    padding: 0 2px;
    cursor: pointer;
  }
  .btn-del-char:hover { color: var(--accent); }

  /* トグルボタン */
  .category-title {
    font-size: 0.85rem;
    font-weight: bold;
    color: #6c757d;
    margin: 12px 0 6px 0;
  }
  .toggle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .btn-toggle {
    padding: 10px 6px;
    font-size: 0.85rem;
    font-weight: bold;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
    color: #495057;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    min-height: 48px;
    line-height: 1.2;
  }
  .btn-toggle.active {
    background: var(--primary);
    color: #ffffff;
    border-color: var(--primary);
  }
  .btn-toggle.debuff.active {
    background: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>

<div class="container">
  <!-- 左カラム: キャラ選択 & 基礎ステータス -->
  <div>
    <!-- キャラ保存管理 -->
    <div class="card">
      <h2>キャラクターデータ</h2>
      <div class="char-save-bar">
        <input type="text" id="char-name" placeholder="キャラクター名">
        <button class="btn-main" onclick="saveCharacter()">保存</button>
      </div>
      <div class="char-list" id="char-chip-list">
        <!-- 保存済みキャラチップがここに生成されます -->
      </div>
    </div>

    <!-- 基礎ステータス設定 -->
    <div class="card">
      <h2>基礎ステータス (基準値)</h2>
      <div class="input-group"><label>命中力</label><input type="number" id="base-acc" value="6" onchange="calculate()"></div>
      <div class="input-group"><label>回避力</label><input type="number" id="base-eva" value="5" onchange="calculate()"></div>
      <div class="input-group"><label>防護点</label><input type="number" id="base-arm" value="3" onchange="calculate()"></div>
      <div class="input-group"><label>生命抵抗力</label><input type="number" id="base-fort" value="5" onchange="calculate()"></div>
      <div class="input-group"><label>精神抵抗力</label><input type="number" id="base-will" value="5" onchange="calculate()"></div>
      <div class="input-group"><label>追加ダメージ</label><input type="number" id="base-dmg" value="4" onchange="calculate()"></div>
    </div>
  </div>

  <!-- 右カラム: 最終数値表示 & バフデバフ選択 -->
  <div>
    <!-- 最終数値画面 -->
    <div class="card">
      <h2>計算結果</h2>
      <div class="stat-grid">
        <!-- 命中 -->
        <div class="stat-box">
          <div class="stat-title">命中力</div>
          <div class="stat-value" id="res-acc">6</div>
          <div class="stat-diff" id="diff-acc">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('acc', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('acc', 1)">+1</button>
          </div>
        </div>
        <!-- 回避 -->
        <div class="stat-box">
          <div class="stat-title">回避力</div>
          <div class="stat-value" id="res-eva">5</div>
          <div class="stat-diff" id="diff-eva">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('eva', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('eva', 1)">+1</button>
          </div>
        </div>
        <!-- 防護点 -->
        <div class="stat-box">
          <div class="stat-title">防護点</div>
          <div class="stat-value" id="res-arm">3</div>
          <div class="stat-diff" id="diff-arm">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('arm', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('arm', 1)">+1</button>
          </div>
        </div>
        <!-- 生命抵抗 -->
        <div class="stat-box">
          <div class="stat-title">生命抵抗</div>
          <div class="stat-value" id="res-fort">5</div>
          <div class="stat-diff" id="diff-fort">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('fort', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('fort', 1)">+1</button>
          </div>
        </div>
        <!-- 精神抵抗 -->
        <div class="stat-box">
          <div class="stat-title">精神抵抗</div>
          <div class="stat-value" id="res-will">5</div>
          <div class="stat-diff" id="diff-will">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('will', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('will', 1)">+1</button>
          </div>
        </div>
        <!-- 追加D -->
        <div class="stat-box">
          <div class="stat-title">追加D</div>
          <div class="stat-value" id="res-dmg">4</div>
          <div class="stat-diff" id="diff-dmg">±0</div>
          <div class="custom-ctrl">
            <button class="btn-step" onclick="adjCustom('dmg', -1)">-1</button>
            <button class="btn-step" onclick="adjCustom('dmg', 1)">+1</button>
          </div>
        </div>
      </div>
    </div>

    <!-- バフ・デバフ切替ボタン -->
    <div class="card">
      <h2>能力・効果の切り替え</h2>
      
      <div class="category-title">【練技】(画像データ)</div>
      <div class="toggle-grid">
        <button class="btn-toggle" data-mods='{"acc":1}'>キャッツアイ<br><small>(命中+1)</small></button>
        <button class="btn-toggle" data-mods='{"eva":1}'>ガゼルフット<br><small>(回避+1)</small></button>
        <button class="btn-toggle" data-mods='{"dmg":2}'>マッスルベアー<br><small>(追加D+2)</small></button>
        <button class="btn-toggle" data-mods='{"arm":2}'>ビートルスキン<br><small>(防護点+2)</small></button>
        <button class="btn-toggle" data-mods='{"acc":1}'>デーモンフィンガー<br><small>(命中+1)</small></button>
        <button class="btn-toggle" data-mods='{"dmg":1}'>ジャイアントアーム<br><small>(追加D+1)</small></button>
        <button class="btn-toggle" data-mods='{"eva":1}'>ケンタウロスレッグ<br><small>(回避+1)</small></button>
        <button class="btn-toggle" data-mods='{"arm":4}'>トロールバイタル<br><small>(防護点+4)</small></button>
      </div>

      <div class="category-title">【魔法・呪歌・戦闘特技】</div>
      <div class="toggle-grid">
        <button class="btn-toggle" data-mods='{"acc":1}'>モラル<br><small>(命中+1)</small></button>
        <button class="btn-toggle" data-mods='{"will":1}'>レジスタンス<br><small>(精神抵抗+1)</small></button>
        <button class="btn-toggle" data-mods='{"arm":1}'>フィールドプロテクション<br><small>(防護点+1)</small></button>
        <button class="btn-toggle" data-mods='{"dmg":2}'>ヴォーパルウェポン<br><small>(追加D+2)</small></button>
        <button class="btn-toggle" data-mods='{"fort":1,"will":1}'>ガッツ/ポーション<br><small>(抵抗+1)</small></button>
        <button class="btn-toggle" data-mods='{"acc":1,"eva":1}'>ファングズ<br><small>(命中/回避+1)</small></button>
      </div>

      <div class="category-title">【状態異常・デバフ】</div>
      <div class="toggle-grid">
        <button class="btn-toggle debuff" data-mods='{"acc":-2,"eva":-2}'>転倒<br><small>(命中-2/回避-2)</small></button>
        <button class="btn-toggle debuff" data-mods='{"acc":-2,"eva":-2}'>暗闇<br><small>(命中-2/回避-2)</small></button>
        <button class="btn-toggle debuff" data-mods='{"will":-2}'>マインドボウ<br><small>(精神抵抗-2)</small></button>
        <button class="btn-toggle debuff" data-mods='{"dmg":-2}'>ウェポンブレイク<br><small>(追加D-2)</small></button>
      </div>
    </div>
  </div>
</div>

<script>
  let customMods = { acc: 0, eva: 0, arm: 0, fort: 0, will: 0, dmg: 0 };
  let currentSelectedChar = null;

  // 初期化イベント設定
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.btn-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        calculate();
      });
    });
    loadCharList();
    calculate();
  });

  // カスタム調整の加減算
  function adjCustom(stat, delta) {
    customMods[stat] += delta;
    calculate();
  }

  // ステータス全体計算
  function calculate() {
    const stats = ['acc', 'eva', 'arm', 'fort', 'will', 'dmg'];
    let mods = { acc: 0, eva: 0, arm: 0, fort: 0, will: 0, dmg: 0 };

    // トグルボタンの補正を集計
    document.querySelectorAll('.btn-toggle.active').forEach(btn => {
      const data = JSON.parse(btn.dataset.mods || '{}');
      for (let k in data) {
        if (mods[k] !== undefined) mods[k] += data[k];
      }
    });

    // カスタム調整の値を合算
    stats.forEach(s => {
      mods[s] += customMods[s];
    });

    // 表示更新
    stats.forEach(s => {
      const base = parseInt(document.getElementById(`base-${s}`).value) || 0;
      const mod = mods[s];
      const total = base + mod;

      document.getElementById(`res-${s}`).innerText = total;

      const diffElem = document.getElementById(`diff-${s}`);
      const diffStr = mod > 0 ? `+${mod}` : (mod < 0 ? `${mod}` : '±0');
      diffElem.innerText = diffStr;
      diffElem.className = 'stat-diff ' + (mod > 0 ? 'diff-plus' : (mod < 0 ? 'diff-minus' : ''));
    });
  }

  // --- キャラクターデータのローカル保存管理 ---
  function getSavedData() {
    return JSON.parse(localStorage.getItem('sw25_characters') || '{}');
  }

  function saveCharacter() {
    const nameInput = document.getElementById('char-name');
    const name = nameInput.value.trim();
    if (!name) { alert('キャラクター名を入力してください'); return; }

    const data = getSavedData();
    data[name] = {
      acc: parseInt(document.getElementById('base-acc').value) || 0,
      eva: parseInt(document.getElementById('base-eva').value) || 0,
      arm: parseInt(document.getElementById('base-arm').value) || 0,
      fort: parseInt(document.getElementById('base-fort').value) || 0,
      will: parseInt(document.getElementById('base-will').value) || 0,
      dmg: parseInt(document.getElementById('base-dmg').value) || 0,
    };

    localStorage.setItem('sw25_characters', JSON.stringify(data));
    currentSelectedChar = name;
    loadCharList();
  }

  function selectCharacter(name) {
    const data = getSavedData();
    if (!data[name]) return;

    currentSelectedChar = name;
    document.getElementById('char-name').value = name;
    document.getElementById('base-acc').value = data[name].acc;
    document.getElementById('base-eva').value = data[name].eva;
    document.getElementById('base-arm').value = data[name].arm;
    document.getElementById('base-fort').value = data[name].fort;
    document.getElementById('base-will').value = data[name].will;
    document.getElementById('base-dmg').value = data[name].dmg;

    loadCharList();
    calculate();
  }

  function deleteCharacter(e, name) {
    e.stopPropagation();
    if (!confirm(`「${name}」を削除しますか？`)) return;

    const data = getSavedData();
    delete data[name];
    localStorage.setItem('sw25_characters', JSON.stringify(data));

    if (currentSelectedChar === name) currentSelectedChar = null;
    loadCharList();
  }

  function loadCharList() {
    const data = getSavedData();
    const container = document.getElementById('char-chip-list');
    container.innerHTML = '';

    Object.keys(data).forEach(name => {
      const chip = document.createElement('div');
      chip.className = 'char-chip' + (name === currentSelectedChar ? ' active' : '');
      chip.onclick = () => selectCharacter(name);

      const label = document.createElement('span');
      label.innerText = name;

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del-char';
      delBtn.innerHTML = '&times;';
      delBtn.onclick = (e) => deleteCharacter(e, name);

      chip.appendChild(label);
      chip.appendChild(delBtn);
      container.appendChild(chip);
    });
  }
</script>
</body>
</html>
